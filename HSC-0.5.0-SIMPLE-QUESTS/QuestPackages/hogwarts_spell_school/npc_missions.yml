journal:
  mission_charms_y1: '&e&lNhiệm vụ NPC: &fĐộ chính xác của cổ tay|&7Tìm một Bia Phép Thuật (TARGET) ở khu luyện và click trái hoặc phải vào nó.|&7Không còn yêu cầu tọa độ cố định.|&8Quay lại Flitwick sau khi chat báo mục tiêu đã hoàn thành.'
  mission_charms_y1_done: '&a&lĐã hoàn thành: &fĐộ chính xác của cổ tay|&7Phần thưởng: +60 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_charms_y2: '&e&lNhiệm vụ NPC: &fNhịp điệu của bùa chú|&7Tại lớp Bùa chú, tương tác với Chuông Luyện Phép (BELL) để hoàn thành bài nhịp chú.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_charms_y2_done: '&a&lĐã hoàn thành: &fNhịp điệu của bùa chú|&7Phần thưởng: +80 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_charms_y3: '&e&lNhiệm vụ NPC: &fKiểm soát chú ngữ|&7Đọc giáo trình ở Bục Giảng (LECTERN) trong lớp Bùa chú rồi quay lại báo cáo.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_charms_y3_done: '&a&lĐã hoàn thành: &fKiểm soát chú ngữ|&7Phần thưởng: +100 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_charms_y4: '&e&lNhiệm vụ NPC: &fTriệu tập có kiểm soát|&7Tới Rương Thực Hành (CHEST) trong lớp Bùa chú và kiểm tra mục tiêu triệu tập.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_charms_y4_done: '&a&lĐã hoàn thành: &fTriệu tập có kiểm soát|&7Phần thưởng: +120 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_charms_y5: '&e&lNhiệm vụ NPC: &fKiểm soát âm thanh|&7Tương tác với Khối Nốt Nhạc (NOTE_BLOCK) trong phòng luyện để kiểm tra độ chính xác.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_charms_y5_done: '&a&lĐã hoàn thành: &fKiểm soát âm thanh|&7Phần thưởng: +140 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_charms_y6: '&e&lNhiệm vụ NPC: &fBùa chú nâng cao|&7Hoàn thành bài hiệu chỉnh cuối tại Bia Phép Thuật (TARGET) của lớp Bùa chú.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_charms_y6_done: '&a&lĐã hoàn thành: &fBùa chú nâng cao|&7Phần thưởng: +160 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_dada_y1: '&c&lThực hành Năm 1: &fPhản xạ phòng vệ|&7Vượt qua đấu trường Năm I: Hình Nhân Tập Sự, Mana Slime, Nhện Bị Nguyền và Vệ Binh Xương.|&7Mục tiêu: đánh bại đủ &e7&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Quirrell sau khi objective hoàn thành.'
  mission_dada_y1_done: '&a&lĐã hoàn thành: &fPhản xạ phòng vệ|&7Phần thưởng: +70 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_dada_y2: '&c&lThực hành Năm 2: &fĐấu tay đôi căn bản|&7Vượt qua đấu trường Năm II: Pixie Cornwall, Nhện Độc, Xạ Thủ Bị Nguyền và Đội Trưởng Pixie.|&7Mục tiêu: đánh bại đủ &e8&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Lockhart sau khi objective hoàn thành.'
  mission_dada_y2_done: '&a&lĐã hoàn thành: &fĐấu tay đôi căn bản|&7Phần thưởng: +90 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_dada_y3: '&c&lThực hành Năm 3: &fGiữ bình tĩnh|&7Vượt qua đấu trường Năm III: Boggart, Tiếng Vọng Dementor, Người Sói Tập Sự và Sinh Vật Bóng Tối.|&7Mục tiêu: đánh bại đủ &e9&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Lupin sau khi objective hoàn thành.'
  mission_dada_y3_done: '&a&lĐã hoàn thành: &fGiữ bình tĩnh|&7Phần thưởng: +110 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_dada_y4: '&c&lThực hành Năm 4: &fCảnh giác liên tục|&7Vượt qua đấu trường Năm IV: Cua Lửa, Acromantula, Pháp Sư Hắc Ám Tập Sự và Vệ Binh Tam Pháp Thuật.|&7Mục tiêu: đánh bại đủ &e10&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Moody sau khi objective hoàn thành.'
  mission_dada_y4_done: '&a&lĐã hoàn thành: &fCảnh giác liên tục|&7Phần thưởng: +140 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_dada_y5: '&c&lThực hành Năm 5: &fBài kiểm tra phòng vệ|&7Vượt qua đấu trường Năm V: Tử Thần Thực Tử Tập Sự, Dementor, Inferi và Thanh Tra Hắc Ám.|&7Mục tiêu: đánh bại đủ &e11&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Umbridge sau khi objective hoàn thành.'
  mission_dada_y5_done: '&a&lĐã hoàn thành: &fKiểm tra lý thuyết phòng vệ|&7Phần thưởng: +130 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_potions_y6: '&c&lThực hành Năm 6: &fĐộc dược nâng cao: Thu thập tinh chất|&7Snape yêu cầu đánh bại sinh vật Năm VI để thu tinh chất thực hành: Giáp Nguyền, Inferi Tinh Nhuệ, Pháp Sư Hắc Ám và Chỉ Huy Inferi.|&7Mục tiêu: đánh bại đủ &e12&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại Snape sau khi objective hoàn thành.'
  mission_potions_y6_done: '&a&lĐã hoàn thành: &fĐộc dược nâng cao|&7Phần thưởng: +170 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_transfiguration_y7: '&c&lThực hành Năm 7: &fThử thách tốt nghiệp thực hành|&7Vượt qua đấu trường Năm VII: Chỉ Huy Tử Thần Thực Tử, Inferi Cổ Đại, Tiếng Vọng Hắc Chúa và Vệ Binh Tốt Nghiệp.|&7Mục tiêu: đánh bại đủ &e13&7 quái MythicMobs được triệu hồi riêng.|&8Quay lại McGonagall sau khi objective hoàn thành.'
  mission_transfiguration_y7_done: '&a&lĐã hoàn thành: &fBiến hình chính xác|&7Phần thưởng: +200 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_flying_y4: '&e&lNhiệm vụ Bay nâng cao|&7Chạm vào GOLD_BLOCK tại vạch đích của sân bay.|&7Admin có thể đặt GOLD_BLOCK ở vị trí đích mong muốn.|&8Quay lại Hooch sau khi hoàn thành.'
  mission_flying_y4_done: '&a&lĐã hoàn thành: &fĐường bay nâng cao|&7Phần thưởng: +120 Magic XP, +3 Điểm Nhà, +25 Galleon.'
  mission_herbology_y3: '&e&lNhiệm vụ NPC: &fNhà kính nâng cao|&7Tương tác với COMPOSTER tại nhà kính để hoàn thành bài nhận biết môi trường trồng cây.|&8Quay lại NPC sau khi mục tiêu hoàn thành.'
  mission_herbology_y3_done: '&a&lĐã hoàn thành: &fNhà kính nâng cao|&7Phần thưởng: +100 Magic XP, +3 Điểm Nhà, +25 Galleon.'
