conversations:
  quirrell:
    quester: '&5&lGiáo sư Quirinus Quirrell&r'
    first: mission_turnin_dada_y1,mission_remind_dada_y1,mission_offer_dada_y1,complete_petrificus_totalus,remind_petrificus_totalus,offer_petrificus_totalus,complete_locomotor_mortis,remind_locomotor_mortis,offer_locomotor_mortis,locked,all_done
    stop: 'true'
    NPC_options:
      mission_offer_dada_y1:
        text: '&eThực hành chiến đấu — Năm 1: &fPhản xạ phòng vệ&7. Vượt qua đấu trường Năm I: Hình Nhân Tập Sự, Mana Slime, Nhện Bị Nguyền và Vệ Binh Xương. Tổng cộng &e7&7 mục tiêu. Em nhận bài chứ?'
        conditions: can_start_mission_dada_y1
        pointers: mission_accept_dada_y1,mission_decline
      mission_start_dada_y1:
        text: '&aBắt đầu.&7 Ta đã triệu hồi quái luyện tập &eriêng cho em&7 tại đấu trường. Hãy đánh bại đủ &e7&7 mục tiêu rồi quay lại.'
        actions: start_mission_dada_y1
        pointers: mission_go
      mission_remind_dada_y1:
        text: '&eBài Năm 1 vẫn chưa xong.&7 Hãy quay lại đấu trường và đánh bại đủ &e7&7 quái luyện tập đã được giao.'
        conditions: in_progress_mission_dada_y1
        pointers: mission_go
      mission_turnin_dada_y1:
        text: '&aĐạt yêu cầu.&7 Em đã hoàn thành bài thực hành chiến đấu Năm 1. Các bài học/phép tiếp theo tương ứng giờ đã được mở.'
        conditions: can_turnin_mission_dada_y1
        actions: finish_mission_dada_y1
        pointers: mission_thanks
      mission_continue_exit:
        text: '&eNhiệm vụ vẫn đang tiếp tục.&7 Hoàn thành mục tiêu rồi quay lại. Ta sẽ không tính là xong trước khi em nộp bài.'
      mission_return_exit:
        text: '&7Được. Khi sẵn sàng hãy quay lại nhận nhiệm vụ.'
      mission_complete_exit:
        text: '&aTốt.&7 Nhiệm vụ môn học đã được ghi nhận hoàn thành.'
      offer_petrificus_totalus:
        text: 'C-chào em. Hôm nay chúng ta sẽ luyện một phép phòng vệ cơ bản. Bài tiếp theo là &fPetrificus Totalus&7 — Bùa Đông Cứng Toàn Thân. Yêu cầu: Năm 1, Cấp phép 3. Em có muốn bắt đầu không?'
        conditions: can_start_petrificus_totalus
        pointers: accept_petrificus_totalus,decline
      start_msg_petrificus_totalus:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Petrificus Totalus. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_petrificus_totalus
        pointers: leave
      remind_petrificus_totalus:
        text: Bài Petrificus Totalus chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_petrificus_totalus
        pointers: leave
      complete_petrificus_totalus:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Petrificus Totalus; từ giờ phép này thuộc Sổ Phép của em.
        conditions: ready_petrificus_totalus
        actions: complete_petrificus_totalus
        pointers: thanks
      offer_locomotor_mortis:
        text: 'C-chào em. Hôm nay chúng ta sẽ luyện một phép phòng vệ cơ bản. Bài tiếp theo là &fLocomotor Mortis&7 — Bùa Khoá Chân. Yêu cầu: Năm 1, Cấp phép 4. Em có muốn bắt đầu không?'
        conditions: can_start_locomotor_mortis
        pointers: accept_locomotor_mortis,decline
      start_msg_locomotor_mortis:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Locomotor Mortis. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_locomotor_mortis
        pointers: leave
      remind_locomotor_mortis:
        text: Bài Locomotor Mortis chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_locomotor_mortis
        pointers: leave
      complete_locomotor_mortis:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Locomotor Mortis; từ giờ phép này thuộc Sổ Phép của em.
        conditions: ready_locomotor_mortis
        actions: complete_locomotor_mortis
        pointers: thanks
      locked:
        text: 'Hiện chưa có bài mới phù hợp. Hãy kiểm tra &f/hogwarts&7: đúng năm học, đủ Cấp phép và hoàn thành bài trước của môn này.'
        pointers: return_later
      all_done:
        text: Em đã hoàn tất toàn bộ bài mà ta phụ trách ở giai đoạn hiện tại. Hãy tiếp tục môn còn lại hoặc tới gặp Hiệu trưởng khi đã xong cả năm.
        pointers: return_later
      practice_exit:
        text: '&eBài học vẫn đang tiếp tục.&7 Hãy luyện đủ yêu cầu và hệ thống sẽ tự chấm khi hoàn thành. Ta sẽ chỉ công nhận khi em hoàn thành bài.'
      return_exit:
        text: '&7Được. Khi đủ điều kiện hoặc sẵn sàng, hãy quay lại gặp ta.'
      complete_exit:
        text: '&aTốt lắm.&7 Bài học này đã hoàn thành. Phép vừa học đã được ghi vào Sổ Phép của em.'
    player_options:
      mission_accept_dada_y1:
        text: '&aEm nhận nhiệm vụ.'
        pointers: mission_start_dada_y1
      mission_decline:
        text: '&7Em sẽ quay lại sau.'
        pointers: mission_return_exit
      mission_go:
        text: '&aEm đi làm nhiệm vụ ngay.'
        pointers: mission_continue_exit
      mission_thanks:
        text: '&aEm cảm ơn giáo sư.'
        pointers: mission_complete_exit
      accept_petrificus_totalus:
        text: '&aEm muốn học Petrificus Totalus.'
        pointers: start_msg_petrificus_totalus
      accept_locomotor_mortis:
        text: '&aEm muốn học Locomotor Mortis.'
        pointers: start_msg_locomotor_mortis
      decline:
        text: '&7Em sẽ quay lại sau.'
        pointers: return_exit
      leave:
        text: '&aEm đi luyện tiếp ạ.'
        pointers: practice_exit
      thanks:
        text: '&aEm cảm ơn giáo sư.'
        pointers: complete_exit
      return_later:
        text: '&7Vâng, em sẽ quay lại sau.'
        pointers: return_exit
