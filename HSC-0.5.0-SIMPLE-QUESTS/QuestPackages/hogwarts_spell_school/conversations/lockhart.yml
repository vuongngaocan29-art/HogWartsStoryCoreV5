conversations:
  lockhart:
    quester: '&6&lGiáo sư Gilderoy Lockhart&r'
    first: mission_turnin_dada_y2,mission_remind_dada_y2,mission_offer_dada_y2,complete_expelliarmus,remind_expelliarmus,offer_expelliarmus,complete_rictusempra,remind_rictusempra,offer_rictusempra,complete_serpensortia,remind_serpensortia,offer_serpensortia,locked,all_done
    stop: 'true'
    NPC_options:
      mission_offer_dada_y2:
        text: '&eThực hành chiến đấu — Năm 2: &fĐấu tay đôi căn bản&7. Vượt qua đấu trường Năm II: Pixie Cornwall, Nhện Độc, Xạ Thủ Bị Nguyền và Đội Trưởng Pixie. Tổng cộng &e8&7 mục tiêu. Em nhận bài chứ?'
        conditions: can_start_mission_dada_y2
        pointers: mission_accept_dada_y2,mission_decline
      mission_start_dada_y2:
        text: '&aBắt đầu.&7 Ta đã triệu hồi quái luyện tập &eriêng cho em&7 tại đấu trường. Hãy đánh bại đủ &e8&7 mục tiêu rồi quay lại.'
        actions: start_mission_dada_y2
        pointers: mission_go
      mission_remind_dada_y2:
        text: '&eBài Năm 2 vẫn chưa xong.&7 Hãy quay lại đấu trường và đánh bại đủ &e8&7 quái luyện tập đã được giao.'
        conditions: in_progress_mission_dada_y2
        pointers: mission_go
      mission_turnin_dada_y2:
        text: '&aĐạt yêu cầu.&7 Em đã hoàn thành bài thực hành chiến đấu Năm 2. Các bài học/phép tiếp theo tương ứng giờ đã được mở.'
        conditions: can_turnin_mission_dada_y2
        actions: finish_mission_dada_y2
        pointers: mission_thanks
      mission_continue_exit:
        text: '&eNhiệm vụ vẫn đang tiếp tục.&7 Hoàn thành mục tiêu rồi quay lại. Ta sẽ không tính là xong trước khi em nộp bài.'
      mission_return_exit:
        text: '&7Được. Khi sẵn sàng hãy quay lại nhận nhiệm vụ.'
      mission_complete_exit:
        text: '&aTốt.&7 Nhiệm vụ môn học đã được ghi nhận hoàn thành.'
      offer_expelliarmus:
        text: 'Một tiết học tuyệt vời đang chờ em. Hãy xem kỹ phần trình diễn trước khi thử. Bài tiếp theo là &fExpelliarmus&7 — Bùa Tước Vũ Khí. Yêu cầu: Năm 2, Cấp phép 5. Em có muốn bắt đầu không?'
        conditions: can_start_expelliarmus
        pointers: accept_expelliarmus,decline
      start_msg_expelliarmus:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Expelliarmus. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_expelliarmus
        pointers: leave
      remind_expelliarmus:
        text: Bài Expelliarmus chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_expelliarmus
        pointers: leave
      complete_expelliarmus:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Expelliarmus; từ giờ phép này thuộc Sổ Phép của em.
        conditions: ready_expelliarmus
        actions: complete_expelliarmus
        pointers: thanks
      offer_rictusempra:
        text: 'Một tiết học tuyệt vời đang chờ em. Hãy xem kỹ phần trình diễn trước khi thử. Bài tiếp theo là &fRictusempra&7 — Bùa Thọt Lét. Yêu cầu: Năm 2, Cấp phép 5. Em có muốn bắt đầu không?'
        conditions: can_start_rictusempra
        pointers: accept_rictusempra,decline
      start_msg_rictusempra:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Rictusempra. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_rictusempra
        pointers: leave
      remind_rictusempra:
        text: Bài Rictusempra chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_rictusempra
        pointers: leave
      complete_rictusempra:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Rictusempra; từ giờ phép này thuộc Sổ Phép của em.
        conditions: ready_rictusempra
        actions: complete_rictusempra
        pointers: thanks
      offer_serpensortia:
        text: 'Một tiết học tuyệt vời đang chờ em. Hãy xem kỹ phần trình diễn trước khi thử. Bài tiếp theo là &fSerpensortia&7 — Bùa Gọi Rắn. Yêu cầu: Năm 2, Cấp phép 6. Em có muốn bắt đầu không?'
        conditions: can_start_serpensortia
        pointers: accept_serpensortia,decline
      start_msg_serpensortia:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Serpensortia. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_serpensortia
        pointers: leave
      remind_serpensortia:
        text: Bài Serpensortia chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_serpensortia
        pointers: leave
      complete_serpensortia:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Serpensortia; từ giờ phép này thuộc Sổ Phép của em.
        conditions: ready_serpensortia
        actions: complete_serpensortia
        pointers: thanks
      locked:
        text: 'Hiện chưa có bài mới phù hợp. Hãy kiểm tra &f/hogwarts&7: đúng năm học, đủ Cấp phép và hoàn thành bài trước của môn này.'
        pointers: return_later
      all_done:
        text: Em đã hoàn tất toàn bộ bài mà ta phụ trách ở giai đoạn hiện tại. Hãy tiếp tục môn còn lại hoặc tới gặp Hiệu trưởng khi đã xong cả năm.
        pointers: return_later
      practice_exit:
        text: '&eBài học vẫn đang tiếp tục.&7 Hãy luyện đủ yêu cầu và hệ thống sẽ tự chấm khi hoàn thành. Ta sẽ chỉ công nhận khi em hoàn thành bài.'
      return_exit:
        text: '&7Được. Khi đủ điều kiện hoặc sẵn sàng, hãy quay lại gặp ta.'
      complete_exit:
        text: '&aTốt lắm.&7 Bài học này đã hoàn thành. Phép vừa học đã được ghi vào Sổ Phép của em.'
    player_options:
      mission_accept_dada_y2:
        text: '&aEm nhận nhiệm vụ.'
        pointers: mission_start_dada_y2
      mission_decline:
        text: '&7Em sẽ quay lại sau.'
        pointers: mission_return_exit
      mission_go:
        text: '&aEm đi làm nhiệm vụ ngay.'
        pointers: mission_continue_exit
      mission_thanks:
        text: '&aEm cảm ơn giáo sư.'
        pointers: mission_complete_exit
      accept_expelliarmus:
        text: '&aEm muốn học Expelliarmus.'
        pointers: start_msg_expelliarmus
      accept_rictusempra:
        text: '&aEm muốn học Rictusempra.'
        pointers: start_msg_rictusempra
      accept_serpensortia:
        text: '&aEm muốn học Serpensortia.'
        pointers: start_msg_serpensortia
      decline:
        text: '&7Em sẽ quay lại sau.'
        pointers: return_exit
      leave:
        text: '&aEm đi luyện tiếp ạ.'
        pointers: practice_exit
      thanks:
        text: '&aEm cảm ơn giáo sư.'
        pointers: complete_exit
      return_later:
        text: '&7Vâng, em sẽ quay lại sau.'
        pointers: return_exit
