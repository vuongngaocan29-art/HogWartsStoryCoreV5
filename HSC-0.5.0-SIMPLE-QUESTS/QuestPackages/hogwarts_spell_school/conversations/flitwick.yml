        actions: finish_mission_charms_y2
        pointers: mission_thanks
      mission_offer_charms_y3:
        text: '&eNhiệm vụ môn học — Năm 3: &fKiểm soát chú ngữ&7. Đọc giáo trình ở Bục Giảng (LECTERN) trong lớp Bùa chú rồi quay lại báo cáo. Em nhận bài chứ?'
