      offer_lumos:
        text: 'Chào em. Bùa chú đòi hỏi phát âm chính xác, cổ tay ổn định và một chút kiên nhẫn. Bài tiếp theo là &fLumos&7 — Bùa Phát Sáng. Yêu cầu: Năm 1, Cấp phép 1. Em có muốn bắt đầu không?'
        conditions: can_start_lumos
        pointers: accept_lumos,decline
      start_msg_lumos:
        text: Tốt. Ta đã mở quyền &eluyện tạm thời&7 cho Lumos. Hãy niệm thành công 3 lần. Khi đủ 3 lần thành công, phép sẽ tự mở khoá vĩnh viễn và nhận thưởng.
        actions: start_lumos
        pointers: leave
      remind_lumos:
        text: Bài Lumos chưa đạt. Em cần niệm thành công 3 lần; đủ số lần hệ thống sẽ tự chấm.
        conditions: in_progress_lumos
        pointers: leave
      complete_lumos:
        text: Được rồi. Kiểm soát ổn định và câu chú rõ ràng. Em đã đạt bài Lumos; từ giờ phép này thuộc Sổ Phép của em.
