    stop: 'true'
    NPC_options:
      mission_offer_charms_y1:
        text: '&eNhiệm vụ Năm I: &fĐộ chính xác của cổ tay&7. Tới khu luyện Bùa chú và click trái hoặc phải vào một &fBia Phép Thuật (TARGET)&7. Em nhận bài chứ?'
        conditions: can_start_mission_charms_y1
        pointers: mission_accept_charms_y1,mission_decline
      mission_start_charms_y1:
        text: '&aTốt.&7 Hãy tới khu luyện và click trái hoặc phải vào &fTARGET&7. Khi thành công, em sẽ thấy thông báo màu xanh. Sau đó quay lại gặp ta.'
        actions: start_mission_charms_y1
        pointers: mission_go
      mission_remind_charms_y1:
        text: '&eNhiệm vụ vẫn đang tiếp tục.&7 Hãy click trái hoặc phải vào một &fBia Phép Thuật (TARGET)&7. Khi chat báo &aĐã hoàn thành mục tiêu&7 thì quay lại đây.'
        conditions: in_progress_mission_charms_y1
        pointers: mission_go
      mission_turnin_charms_y1:
        text: '&aTa đã kiểm tra kết quả.&7 Em hoàn thành &fĐộ chính xác của cổ tay&7. Từ giờ các bài phép tương ứng của môn này đã mở cho em.'
        conditions: can_turnin_mission_charms_y1
        actions: finish_mission_charms_y1
        pointers: mission_thanks
      mission_offer_charms_y2:
        text: '&eNhiệm vụ môn học — Năm 2: &fNhịp điệu của bùa chú&7. Tại lớp Bùa chú, tương tác với Chuông Luyện Phép (BELL) để hoàn thành bài nhịp chú. Em nhận bài chứ?'
        conditions: can_start_mission_charms_y2
        pointers: mission_accept_charms_y2,mission_decline
      mission_start_charms_y2:
        text: '&aTốt.&7 Ta đã ghi nhiệm vụ &fNhịp điệu của bùa chú&7 vào Sổ Nhiệm Vụ. Hoàn thành mục tiêu và hệ thống sẽ tự chấm khi hoàn thành.'
        actions: start_mission_charms_y2
        pointers: mission_go
      mission_remind_charms_y2:
        text: '&eBài &fNhịp điệu của bùa chú&e vẫn chưa xong.&7 Tại lớp Bùa chú, tương tác với Chuông Luyện Phép (BELL) để hoàn thành bài nhịp chú.'
        conditions: in_progress_mission_charms_y2
        pointers: mission_go
      mission_turnin_charms_y2:
        text: '&aTa đã kiểm tra kết quả.&7 Em hoàn thành &fNhịp điệu của bùa chú&7. Từ giờ các bài phép tương ứng của môn này đã mở cho em.'
